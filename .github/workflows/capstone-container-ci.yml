name: Capstone Container CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - '.github/workflows/capstone-container-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - '.github/workflows/capstone-container-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Vote dependencies
        run: python -m pip install --dry-run -r vote/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Install Result dependencies
        working-directory: result
        run: npm ci

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore Worker dependencies
        run: dotnet restore worker/Worker.csproj

      - name: Build Worker
        run: dotnet build worker/Worker.csproj --configuration Release --no-restore

  build-scan-publish:
    name: Build, scan and publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            image: ghcr.io/morecrownsamuel/example-voting-app-vote
            context: ./vote
          - service: result
            image: ghcr.io/morecrownsamuel/example-voting-app-result
            context: ./result
          - service: worker
            image: ghcr.io/morecrownsamuel/example-voting-app-worker
            context: ./worker

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publish SHA-tagged image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "${{ matrix.image }}:${{ github.sha }}"
